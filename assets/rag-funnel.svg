<svg width="760" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Hybrid retrieval funnel</title><desc id="d">Funnel: all research abstracts are filtered by BM25, re-ranked with Sentence-BERT embeddings in FAISS, leaving the top papers for the answer.</desc><rect width="760" height="320" fill="#ffffff"/><text x="380" y="34" text-anchor="middle" fill="#1a7f5a" font-size="12" font-weight="700" letter-spacing="1.5" font-family="Inter,system-ui,Arial,sans-serif">FROM SLOW SEQUENTIAL SEARCH TO A TWO-STAGE PIPELINE</text><path d="M60.0 50H700.0L630.0 104H130.0Z" fill="#f3f9f6" stroke="#1a7f5a" stroke-width="1.4"/><text x="380" y="75" text-anchor="middle" fill="#14232a" font-size="15" font-weight="700" font-family="Inter,system-ui,Arial,sans-serif">All research abstracts</text><path d="M130.0 114H630.0L560.0 168H200.0Z" fill="#e4f3ec" stroke="#1a7f5a" stroke-width="1.4"/><text x="380" y="139" text-anchor="middle" fill="#14232a" font-size="15" font-weight="700" font-family="Inter,system-ui,Arial,sans-serif">BM25 lexical filter</text><text x="380" y="157" text-anchor="middle" fill="#4d6168" font-size="12" font-family="Inter,system-ui,Arial,sans-serif">fast keyword candidate set</text><path d="M200.0 178H560.0L490.0 232H270.0Z" fill="#d3ecdf" stroke="#1a7f5a" stroke-width="1.4"/><text x="380" y="203" text-anchor="middle" fill="#14232a" font-size="15" font-weight="700" font-family="Inter,system-ui,Arial,sans-serif">Sentence-BERT + FAISS</text><text x="380" y="221" text-anchor="middle" fill="#4d6168" font-size="12" font-family="Inter,system-ui,Arial,sans-serif">semantic re-ranking</text><path d="M270.0 242H490.0L420.0 296H340.0Z" fill="#c0e4d2" stroke="#1a7f5a" stroke-width="1.4"/><text x="380" y="267" text-anchor="middle" fill="#14232a" font-size="15" font-weight="700" font-family="Inter,system-ui,Arial,sans-serif">Top papers</text><text x="380" y="285" text-anchor="middle" fill="#4d6168" font-size="12" font-family="Inter,system-ui,Arial,sans-serif">used to answer the question</text></svg>