<text x="287" y="102" fill="#14232a" font-size="14" font-weight="700">Histogram</text>
<text x="287" y="119" fill="#14232a" font-size="14" font-weight="700">analysis</text>
<text x="287" y="142" fill="#4d6168" font-size="11.5">brightness gaps</text>
<path d="M369 120.0H390" stroke="#b4532a" stroke-width="2" marker-end="url(#a)"/>
<rect x="393" y="80" width="160" height="80" rx="10" fill="#f4ddd0" stroke="#b4532a" stroke-width="1.6"/>
<text x="473" y="102" fill="#14232a" font-size="14" font-weight="700">Filter</text>
<text x="473" y="119" fill="#14232a" font-size="14" font-weight="700">comparison</text>
<text x="473" y="142" fill="#4d6168" font-size="11.5">Gaussian · median · bilateral</text>
