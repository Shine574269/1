<text x="660" y="142" fill="#4d6168" font-size="11.5">chosen pipeline</text>
<text x="380" y="215" fill="#b4532a" font-size="30" font-weight="800">−45%</text>
<text x="380" y="240" fill="#4d6168" font-size="13">lighting-induced false alarms</text>
<text x="380" y="275" fill="#4d6168" font-size="13">Controlled tests on 150 samples</text>
