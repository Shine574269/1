<svg width="760" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">Chest X-ray enhancement with U-Net</title><desc id="d">Degraded X-ray enters a U-Net trained with a boundary-weighted loss and augmentation, producing an enhanced image for pneumonia screening.</desc>
<rect width="760" height="300" fill="#10202a"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a6ffca"/></marker></defs>
<g font-family="Inter,system-ui,Arial,sans-serif" text-anchor="middle">
<text x="380" y="44" fill="#a6ffca" font-size="12" letter-spacing="2" font-weight="700">CHEST X-RAY ENHANCEMENT</text>
<rect x="20" y="80" width="123" height="80" rx="10" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/>
<text x="82" y="102" fill="#f0f5f3" font-size="14" font-weight="700">Degraded</text>
<text x="82" y="119" fill="#f0f5f3" font-size="14" font-weight="700">X-ray</text>
<text x="82" y="142" fill="#b8dbd5" font-size="11.5">low contrast · blur</text>
<path d="M145 120.0H166" stroke="#a6ffca" stroke-width="2" marker-end="url(#a)"/>
<rect x="169" y="80" width="123" height="80" rx="10" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/>
<text x="231" y="110" fill="#f0f5f3" font-size="14" font-weight="700">Augmentation</text>
<text x="231" y="142" fill="#b8dbd5" font-size="11.5">elastic · intensity</text>
<path d="M294 120.0H315" stroke="#a6ffca" stroke-width="2" marker-end="url(#a)"/>
<rect x="318" y="80" width="123" height="80" rx="10" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/>
<text x="380" y="110" fill="#f0f5f3" font-size="14" font-weight="700">U-Net</text>
<text x="380" y="142" fill="#b8dbd5" font-size="11.5">encoder–decoder</text>
<path d="M444 120.0H465" stroke="#a6ffca" stroke-width="2" marker-end="url(#a)"/>
<rect x="468" y="80" width="123" height="80" rx="10" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/>
<text x="529" y="110" fill="#f0f5f3" font-size="14" font-weight="700">Weighted loss</text>
<text x="529" y="142" fill="#b8dbd5" font-size="11.5">boundaries · lesions</text>
<path d="M593 120.0H614" stroke="#a6ffca" stroke-width="2" marker-end="url(#a)"/>
<rect x="617" y="80" width="123" height="80" rx="10" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/>
<text x="678" y="102" fill="#f0f5f3" font-size="14" font-weight="700">Enhanced</text>
<text x="678" y="119" fill="#f0f5f3" font-size="14" font-weight="700">image</text>
<text x="678" y="142" fill="#b8dbd5" font-size="11.5">for diagnosis</text>
<text x="380" y="220" fill="#b8dbd5" font-size="13">Loss emphasises anatomical boundaries and suspected abnormal regions</text>
</g></svg>