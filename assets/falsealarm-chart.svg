<svg width="760" height="320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Lighting-induced false alarms before and after preprocessing</title><desc id="d">Bar chart: relative lighting-induced false alarms fall from 100 to 55, a 45 percent reduction, after adaptive histogram equalisation with morphological closing.</desc><rect width="760" height="320" fill="#ffffff"/><g font-family="Inter,system-ui,Arial,sans-serif"><text x="40" y="44" fill="#1a7f5a" font-size="12" font-weight="700" letter-spacing="1.5">LIGHTING-INDUCED FALSE ALARMS (RELATIVE)</text><rect x="80" y="90.0" width="110" height="160.0" rx="6" fill="#5b6b72"/><text x="135" y="274" text-anchor="middle" fill="#14232a" font-size="14" font-weight="700">Before</text><text x="135" y="80.0" text-anchor="middle" fill="#14232a" font-size="14">100</text><rect x="250" y="162.0" width="110" height="88.0" rx="6" fill="#1a7f5a"/><text x="305" y="274" text-anchor="middle" fill="#14232a" font-size="14" font-weight="700">After</text><text x="305" y="152.0" text-anchor="middle" fill="#14232a" font-size="14">55</text><line x1="60" y1="250" x2="400" y2="250" stroke="#9fb5af"/><text x="580" y="130" text-anchor="middle" fill="#1a7f5a" font-size="64" font-weight="800">−45%</text><text x="580" y="160" text-anchor="middle" fill="#4d6168" font-size="13">controlled tests on 150 samples</text><rect x="435" y="200" width="148" height="30" rx="6" fill="#eef6f2" stroke="#b9cfc8"/><text x="509" y="220" text-anchor="middle" fill="#4d6168" font-size="12" font-weight="400">Gaussian blur</text><rect x="590" y="200" width="148" height="30" rx="6" fill="#eef6f2" stroke="#b9cfc8"/><text x="664" y="220" text-anchor="middle" fill="#4d6168" font-size="12" font-weight="400">Median filter</text><rect x="435" y="240" width="148" height="30" rx="6" fill="#eef6f2" stroke="#b9cfc8"/><text x="509" y="260" text-anchor="middle" fill="#4d6168" font-size="12" font-weight="400">Bilateral filter</text><rect x="590" y="240" width="148" height="30" rx="6" fill="#d4efe2" stroke="#1a7f5a"/><text x="664" y="260" text-anchor="middle" fill="#14232a" font-size="12" font-weight="700">Adaptive EQ + closing ✓</text></g></svg>