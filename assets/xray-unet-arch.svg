<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">U-Net architecture for X-ray enhancement</title><desc id="d">An encoder of shrinking feature blocks, a bottleneck, and a decoder of growing blocks, joined by skip connections, mapping a degraded X-ray to an enhanced one.</desc><rect width="760" height="340" fill="#10202a"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a6ffca"/></marker><radialGradient id="xr"><stop offset="0" stop-color="#d9dde0"/><stop offset="1" stop-color="#3b4248"/></radialGradient><filter id="bl"><feGaussianBlur stdDeviation="3"/></filter></defs><rect x="150" y="60" width="22" height="150" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/><rect x="588" y="60" width="22" height="150" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/><path d="M176 135.0H582" stroke="#4b817a" stroke-dasharray="5 5" stroke-width="1.5" marker-end="url(#a)"/><rect x="210" y="110" width="26" height="110" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/><rect x="524" y="110" width="26" height="110" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/><path d="M240 165.0H518" stroke="#4b817a" stroke-dasharray="5 5" stroke-width="1.5" marker-end="url(#a)"/><rect x="270" y="160" width="30" height="72" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/><rect x="460" y="160" width="30" height="72" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/><path d="M304 196.0H454" stroke="#4b817a" stroke-dasharray="5 5" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="205" width="34" height="42" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/><rect x="396" y="205" width="34" height="42" fill="#132b29" stroke="#a6ffca" stroke-width="1.6"/><path d="M368 226.0H390" stroke="#4b817a" stroke-dasharray="5 5" stroke-width="1.5" marker-end="url(#a)"/><rect x="355" y="250" width="50" height="30" fill="#1d4a3c" stroke="#a6ffca" stroke-width="1.6"/><g stroke="#a6ffca" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M165 212L205 230"/><path d="M225 222L265 238"/><path d="M285 234L350 258"/><path d="M410 258L476 234"/><path d="M500 238L540 222"/><path d="M560 230L600 212"/></g><rect x="30" y="100" width="80" height="80" rx="4" fill="url(#xr)" opacity=".5" filter="url(#bl)"/><rect x="650" y="100" width="80" height="80" rx="4" fill="url(#xr)"/><g stroke="#a6ffca" stroke-width="2" marker-end="url(#a)"><path d="M112 140H146"/><path d="M614 140H646"/></g><g font-family="Inter,system-ui,Arial,sans-serif" text-anchor="middle"><text x="70" y="200" fill="#b8dbd5" font-size="12">degraded</text><text x="690" y="200" fill="#b8dbd5" font-size="12">enhanced</text><text x="380" y="300" fill="#f0f5f3" font-size="13" font-weight="700">bottleneck</text><text x="230" y="40" fill="#a6ffca" font-size="12" font-weight="700" letter-spacing="1.5">ENCODER</text><text x="530" y="40" fill="#a6ffca" font-size="12" font-weight="700" letter-spacing="1.5">DECODER</text><text x="380" y="95" fill="#7fa9a3" font-size="11">skip connections</text><text x="380" y="328" fill="#b8dbd5" font-size="12">Weighted loss emphasises anatomical boundaries and suspected abnormal regions</text></g></svg>