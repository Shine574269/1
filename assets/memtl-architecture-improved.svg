<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67cba4"/></marker></defs><rect width="1160" height="630" rx="24" fill="#0d1920"/><text x="60" y="65" font-family="Arial" font-size="27" font-weight="700" fill="#e8fff5">Multi-Head Ensemble Multi-Task Learning (MEMTL)</text><text x="60" y="98" font-family="Arial" font-size="17" fill="#99b8b9">Shared representation · specialised heads · head-selection strategies</text><g font-family="Arial" text-anchor="middle"><rect x="420" y="130" width="320" height="65" rx="14" fill="#203d44" stroke="#5ca69b"/><text x="580" y="169" font-size="19" fill="white">Input: MEC features (6N)</text><rect x="395" y="244" width="370" height="95" rx="14" fill="#17373d" stroke="#5ca69b"/><text x="580" y="278" font-size="21" fill="#e8fff5">Shared backbone</text><text x="580" y="310" font-size="17" fill="#c0e0d7">Dense(60, ReLU) → Dense(10N, ReLU)</text><rect x="80" y="389" width="300" height="93" rx="12" fill="#233238" stroke="#67cba4"/><text x="230" y="424" font-size="21" fill="#e8fff5">Head 1</text><text x="230" y="452" font-size="17" fill="#c8dbdb">Dense(40, ReLU) → Dense(N, sigmoid)</text><rect x="410" y="389" width="300" height="93" rx="12" fill="#233238" stroke="#67cba4"/><text x="560" y="424" font-size="21" fill="#e8fff5">Head 2</text><text x="560" y="452" font-size="17" fill="#c8dbdb">Dense(40, ReLU) → Dense(N, sigmoid)</text><rect x="740" y="389" width="300" height="93" rx="12" fill="#233238" stroke="#67cba4"/><text x="890" y="424" font-size="21" fill="#e8fff5">Head H</text><text x="890" y="452" font-size="17" fill="#c8dbdb">Dense(40, ReLU) → Dense(N, sigmoid)</text><rect x="386" y="520" width="388" height="65" rx="13" fill="#275448" stroke="#9af1b5"/><text x="580" y="547" font-size="21" fill="white">Head selection</text><text x="580" y="570" font-size="16" fill="white">Oracle (upper bound) / Voting / Gating</text></g><g stroke="#67cba4" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M580 196V242"/><path d="M580 340V360H230V388"/><path d="M580 340V388"/><path d="M580 340V360H890V388"/><path d="M230 484V499H580V518"/><path d="M580 484V518"/><path d="M890 484V499H580V518"/></g><text x="60" y="613" fill="#9caeb0" font-size="14" font-family="Arial">Adapted from the original thesis architecture (Fig. 3.1). N = number of mobile users; H = number of heads.</text></svg>